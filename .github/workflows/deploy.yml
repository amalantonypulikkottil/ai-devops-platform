name: Deploy to AWS ECS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Login to ECR
      run: |
        aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 796924254586.dkr.ecr.ap-south-1.amazonaws.com

    - name: Build Docker image
      run: |
        docker build -t ai-devops-app ./app

    - name: Tag image
      run: |
        docker tag ai-devops-app:latest 796924254586.dkr.ecr.ap-south-1.amazonaws.com/ai-devops-app

    - name: Push image
      run: |
        docker push 796924254586.dkr.ecr.ap-south-1.amazonaws.com/ai-devops-app

    - name: Force new deployment
      run: |
        aws ecs update-service \
          --cluster ai-devops-cluster \
          --service ai-devops-service \
          --force-new-deployment
